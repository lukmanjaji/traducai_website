name: Deploy static content

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Clean existing workspace
      run: |
        rm -rf "$WORK"
        mkdir -p "$(dirname "$WORK")"
    - name: Clone repository
      run: |
        set -e
        WORK="$GITHUB_WORKSPACE"
        # cd out of $WORK before deleting it — the runner cd'd into
        # this directory before running the script, and `rm -rf` on
        # the current working directory leaves the shell in a
        # phantom-dir state where every subsequent command fails
        # with "Unable to read current working directory".
        cd /tmp
        git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
          "https://github.com/$GITHUB_REPOSITORY.git" "$WORK"
    - name: Copy site files
      run: cp -r /home/traduc/_work/traduc/traduc/*.* /home/traduc_website/
