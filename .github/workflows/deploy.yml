name: Deploy static content

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        clean: true

    # Only the site's own files go to the web root (not README.md or .github).
    - name: Copy site files
      run: |
        set -e
        cp index.html styles.css script.js favicon.svg /home/traduc_website/
        ls -l /home/traduc_website
